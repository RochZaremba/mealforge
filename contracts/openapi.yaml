openapi: 3.1.0
info:
  title: MealForge API v1 (design draft, not generated from code yet)
  version: 0.0.0-draft
  description: >-
    Contract proposal for WAVE-00. When FastAPI is implemented, publish generated
    openapi.json as the canonical machine-readable contract and test drift.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Liveness check
  /households:
    get:
      operationId: listHouseholds
      responses:
        '200':
          description: Accessible households only
    post:
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
  /households/{householdId}/recipe-links:
    post:
      operationId: saveExternalRecipeLink
      description: Save the URL without remote fetching. No rights to copy are assumed.
      parameters:
        - $ref: '#/components/parameters/householdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                userTitle:
                  type: string
      responses:
        '201':
          description: Saved as link_only
  /households/{householdId}/plans/preview:
    post:
      operationId: previewPlan
      parameters:
        - $ref: '#/components/parameters/householdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekStart]
              properties:
                weekStart:
                  type: string
                  format: date
                seed:
                  type: integer
      responses:
        '200':
          description: Feasible candidate or explicit trade-offs/infeasibility
  /households/{householdId}/plans/commit:
    post:
      operationId: commitPlan
      parameters:
        - $ref: '#/components/parameters/householdId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: Atomic plan/reservations/shopping commit
        '409':
          description: Conflict
  /households/{householdId}/plans/{planId}/swap:
    post:
      operationId: swapMeal
      parameters:
        - $ref: '#/components/parameters/householdId'
        - name: planId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: Atomic swap and recalculated shopping/reservations
        '409':
          description: Plan version conflict
  /households/{householdId}/inventory/transactions:
    post:
      operationId: createInventoryTransaction
      parameters:
        - $ref: '#/components/parameters/householdId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Accepted atomically
        '409':
          description: Quantity version conflict
components:
  parameters:
    householdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
