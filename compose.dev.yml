name: mealforge-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealforge}
      POSTGRES_USER: ${POSTGRES_USER:-mealforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init-env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: {context: ./apps/api}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mealforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mealforge}
      APP_ENV: development
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ./apps/api}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mealforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mealforge}
      APP_ENV: development
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Run make init-env}
      RECIPE_REMOTE_IMPORT_ENABLED: "false"
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment:
      API_BASE_URL: http://api:8000
      APP_ENV: development
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
