[project]
name = "mealforge-api"
version = "0.1.0"
description = "MealForge private household API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "jsonschema>=4.23,<5", "mypy>=1.15,<2", "pytest>=9.0.3,<10", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mealforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a PostgreSQL connection via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
